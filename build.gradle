import java.nio.charset.StandardCharsets
import java.util.Locale

plugins {
    id "idea"
    id "maven-publish"
    id "net.neoforged.gradle.userdev" version "7.1.21"
}

def getGitRef() {
    try {
        final def stdout = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (final Throwable ignored) {
        return "unknown"
    }
}

version = "${semver}+${getGitRef()}"
group = mod_group_id

base {
    archivesName = project.name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named("wrapper", Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

sourceSets.main.resources.setSrcDirs([
    "src/generated/resources",
    "src/main/resources"
])

sourceSets.main.resources {
    exclude("**/.cache/**")
    exclude("**/*.bbmodel")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = StandardCharsets.UTF_8.name()
}

final def hasGithubPackageCredentials =
    (project.hasProperty("gpr.user") && project.hasProperty("gpr.key")) ||
        (System.getenv("GITHUB_ACTOR") && System.getenv("GITHUB_TOKEN"))
final def hasLocalSednaMc = file("../sedna-mc").exists()
def resolveNewestLocalJar(final String path) {
    final def directory = file(path)
    if (!directory.exists()) {
        return null
    }

    final def jars = directory.listFiles()?.findAll { final def file ->
        file.isFile() &&
            file.name.endsWith(".jar") &&
            !file.name.endsWith("-sources.jar") &&
            !file.name.endsWith("-javadoc.jar") &&
            !file.name.contains("-api")
    }?.sort { final def a, final def b ->
        final def byModified = b.lastModified() <=> a.lastModified()
        byModified != 0 ? byModified : a.name <=> b.name
    }

    return jars ? jars.first() : null
}
final def localCeresJar = resolveNewestLocalJar("../ceres/build/libs")
final def localSednaJar = resolveNewestLocalJar("../sedna/build/libs")
final def localBuildrootJar = resolveNewestLocalJar("../buildroot/build/libs")
final def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
final def hasClientRunRequested = requestedTaskNames.any { it.contains("runclient") }
final def clientRunConfigDir = layout.projectDirectory.dir("run/config").asFile
final def clientRunFmlConfigFile = layout.projectDirectory.file("run/config/fml.toml").asFile

final def configureClientRunFmlConfig = tasks.register("configureClientRunFmlConfig") {
    outputs.file(clientRunFmlConfigFile)

    doLast {
        clientRunConfigDir.mkdirs()

        final def existingLines = clientRunFmlConfigFile.exists()
            ? clientRunFmlConfigFile.readLines(StandardCharsets.UTF_8.name())
            : []

        final def updatedLines = []
        def sawEarlyWindowControl = false
        for (final def line : existingLines) {
            if (line.trim().startsWith("earlyWindowControl")) {
                updatedLines.add("earlyWindowControl = false")
                sawEarlyWindowControl = true
            } else {
                updatedLines.add(line)
            }
        }

        if (!sawEarlyWindowControl) {
            updatedLines.add("earlyWindowControl = false")
        }

        clientRunFmlConfigFile.setText(updatedLines.join(System.lineSeparator()) + System.lineSeparator(), StandardCharsets.UTF_8.name())
    }
}

configurations {
    modRuntime
    runtimeClasspath.extendsFrom(modRuntime)
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        url = "https://maven.architectury.dev"
        content { includeGroup "dev.architectury" }
    }
    maven {
        url 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    if (hasGithubPackageCredentials) {
        final def GithubPackages = [
            ["fnuecke/ceres", "li.cil.ceres"],
            ["fnuecke/sedna", "li.cil.sedna"],
            ["fnuecke/buildroot", "li.cil.sedna"]
        ]
        GithubPackages.each { final repo, final group ->
            maven {
                url = uri("https://maven.pkg.github.com/${repo}")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GPR_USER")
                    password = project.findProperty("gpr.key") ?: System.getenv("GPR_KEY")
                }
                content { includeGroup group }
            }
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Local development uses the base libraries directly. Runtime testing still expects a
    // NeoForge Sedna mod to be supplied via an included build or external runtime setup.
    compileOnly "li.cil.ceres:ceres:0.0.4"
    compileOnly "li.cil.sedna:sedna:2.0.8"
    compileOnly "li.cil.sedna:sedna-buildroot:0.0.8"
    runs("li.cil.ceres:ceres:0.0.4") { transitive = false }
    runs("li.cil.sedna:sedna:2.0.8") { transitive = false }
    runs("li.cil.sedna:sedna-buildroot:0.0.8") { transitive = false }
    testImplementation "li.cil.ceres:ceres:0.0.4"
    testImplementation "li.cil.sedna:sedna:2.0.8"
    testImplementation "li.cil.sedna:sedna-buildroot:0.0.8"
    // VS Code's Gradle Build Server currently drops these composite-build compileOnly
    // dependencies from the editor classpath. Add direct jar fallbacks so JDT can
    // resolve local Sedna/Ceres types without changing the normal Gradle build path.
    if (localCeresJar != null) {
        compileOnly files(localCeresJar)
        testImplementation files(localCeresJar)
    }
    if (localSednaJar != null) {
        compileOnly files(localSednaJar)
        testImplementation files(localSednaJar)
    }
    if (localBuildrootJar != null) {
        compileOnly files(localBuildrootJar)
        testImplementation files(localBuildrootJar)
    }

    compileOnly "curse.maven:markdown-manual-reimagined-${markdown_manual_project_id}:${markdown_manual_file_id}"
    if (hasClientRunRequested) {
        modRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
        modRuntime "curse.maven:markdown-manual-reimagined-${markdown_manual_project_id}:${markdown_manual_file_id}"
    }
    if (hasLocalSednaMc) {
        // The runtime Sedna mod stays separate from the core Sedna library and is
        // supplied by the sibling sedna-mc build via settings.gradle substitution.
        modRuntime "curse.maven:sedna-${sedna_project_id}:0.0.0-local"
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    modRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "curse.maven:jade-${jade_project_id}:${jade_file_id}"
    modRuntime "curse.maven:jade-${jade_project_id}:${jade_file_id}"

    testImplementation "org.mockito:mockito-core:5.2.0"
    testImplementation "net.bytebuddy:byte-buddy:1.18.7"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.8.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.8.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.8.2"
}

task packageScripts(type: Zip) {
    archiveFileName = "scripts.zip"
    destinationDirectory = file("$buildDir/resources/main/data/oc2/file_systems")
    from "src/main/scripts"
}

task copyLicensesToResources(type: Copy) {
    from "."
    into file("$buildDir/resources/main")
    include "LICENSE*"
}

processResources.dependsOn(packageScripts)
processResources.dependsOn(copyLicensesToResources)

runs {
    configureEach {
        workingDirectory project.file("run")
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "info"
        modSource project.sourceSets.main
    }

    client {
        systemProperty "neoforge.enabledGameTestNamespaces", mod_id
    }

    server {
        systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        argument "--nogui"
    }

    gameTestServer {
        systemProperty "neoforge.enabledGameTestNamespaces", mod_id
    }

    data {
        arguments.addAll "--mod", mod_id, "--all",
            "--output", file("src/generated/resources/").getAbsolutePath(),
            "--existing", file("src/main/resources/").getAbsolutePath()
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    final def replaceProperties = [
        minecraft_version              : minecraft_version,
        minecraft_version_range        : minecraft_version_range,
        neo_version                    : neo_version,
        neo_version_range              : neo_version_range,
        loader_version_range           : loader_version_range,
        mod_id                         : mod_id,
        mod_name                       : mod_name,
        mod_license                    : mod_license,
        mod_version                    : semver,
        jar_version                    : project.version,
        mod_authors                    : mod_authors,
        mod_description                : mod_description,
        sedna_version_range            : sedna_version_range,
        jei_version_range              : jei_version_range,
        jade_version_range             : jade_version_range,
        markdown_manual_version_range  : markdown_manual_version_range,
    ]
    inputs.properties(replaceProperties)

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand(replaceProperties)
    }
}

jar {
    manifest {
        attributes([
            "FMLAT"                   : "accesstransformer.cfg",
            "Specification-Title"     : "oc2",
            "Specification-Vendor"    : "Sangar",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${project.version}",
            "Implementation-Vendor"   : "Sangar",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "mixins.oc2.json",
        ])
    }
}

task apiJar(type: Jar) {
    archiveClassifier.set("api")
    from sourceSets.main.allSource
    from sourceSets.main.output
    include "li/cil/oc2/api/**"
}

artifacts {
    archives apiJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = semver
            artifact jar
            artifact apiJar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = System.getenv("GITHUB_MAVEN_URL") ?: ""
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

idea {
    module {
        for (final String exclude in ["assets", "run", "out", "logs", "src/generated"]) {
            excludeDirs += file(exclude)
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.matching { it.name == "runClient" }.configureEach {
    dependsOn configureClientRunFmlConfig
}

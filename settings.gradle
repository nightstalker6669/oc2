pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = "oc2-1.21.1-neoforge"
final def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

def substituteLocal = { final directoryName, final libraryName ->
    // VS Code on Windows does not reliably import these sibling composite builds into the Java
    // workspace, which leaves oc2 with dangling required-project entries. The main build has
    // local JAR fallbacks for editor/runtime classpaths, so skip the composite includes here.
    if (isWindows && ["sedna-mc", "ceres", "sedna", "buildroot"].contains(directoryName)) {
        return
    }

    final def path = new File("../${directoryName}");
    if (path.exists()) {
        println("Found local [${directoryName}] project, substituting...")
        includeBuild(path) {
            dependencySubstitution {
                substitute module(libraryName) using project(':')
            }
        }
    }
}

substituteLocal('sedna-mc', 'curse.maven:sedna-511276')
substituteLocal('ceres', 'li.cil.ceres:ceres')
substituteLocal('sedna', 'li.cil.sedna:sedna')
substituteLocal('buildroot', 'li.cil.sedna:sedna-buildroot')
